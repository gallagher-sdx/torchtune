# Config for multi-device LoRA finetuning of the Gemma 4 E4B text tower
# in lora_finetune_distributed.py.
#
# Prerequisites:
#   * Weights: google/gemma-4-e4b-it. Point checkpointer.checkpoint_dir at the snapshot
#     directory (contains model.safetensors, tokenizer.json, chat_template.jinja, ...).
#
# Launch (4 devices):
#   tune run --nnodes 1 --nproc_per_node 4 lora_finetune_distributed --config gemma4/e4b_lora
#
# The output (unembedding) is tied to the token embedding, so it is NOT a LoRA target.

output_dir: /tmp/torchtune/gemma4_e4b/lora

# Tokenizer — Gemma 4 uses an HF fast tokenizer (tokenizer.json) + chat_template.jinja,
# both auto-discovered next to the given path.
tokenizer:
  _component_: torchtune.models.gemma4.gemma4_tokenizer
  path: /PATH/TO/gemma-4-e4b-it/tokenizer.json

# Dataset and Sampler
dataset:
  _component_: torchtune.datasets.alpaca_cleaned_dataset
  packed: False
  split: train[:95%]
seed: null
shuffle: True

# Model Arguments
model:
  _component_: torchtune.models.gemma4.lora_gemma4_e4b
  lora_attn_modules: ['q_proj', 'k_proj', 'v_proj', 'output_proj']
  apply_lora_to_mlp: True
  lora_rank: 32
  lora_alpha: 64
  lora_dropout: 0.0

checkpointer:
  _component_: torchtune.training.FullModelHFCheckpointer
  checkpoint_dir: /PATH/TO/gemma-4-e4b-it/   # snapshot dir containing model.safetensors
  checkpoint_files: [
    model.safetensors,
  ]
  recipe_checkpoint: null
  output_dir: ${output_dir}
  model_type: GEMMA4
resume_from_checkpoint: False
save_adapter_weights_only: True

# Fine-tuning arguments
batch_size: 2
epochs: 1
max_steps_per_epoch: 5  # smoke-train; remove for a real run

optimizer:
  _component_: torch.optim.AdamW
  fused: True
  lr: 2e-4

lr_scheduler:
  _component_: torchtune.training.lr_schedulers.get_cosine_schedule_with_warmup
  num_warmup_steps: 2

loss:
  _component_: torchtune.modules.loss.LinearCrossEntropyLoss

gradient_accumulation_steps: 1
compile: False

# Training env / memory
device: cuda
dtype: bf16
enable_activation_checkpointing: True
enable_activation_offloading: False

# Logging
metric_logger:
  _component_: torchtune.training.metric_logging.DiskLogger
  log_dir: ${output_dir}/logs
log_every_n_steps: 1
log_peak_memory_stats: True
