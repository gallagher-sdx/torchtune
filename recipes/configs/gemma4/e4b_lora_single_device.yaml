# Config for single-device LoRA finetuning of the Gemma 4 E4B text tower in
# lora_finetune_single_device.py. Intended for a CPU smoke-train (set device=cpu) when no
# GPU is available; for real training use a GPU and raise max_steps_per_epoch.
#
# Fill checkpointer.checkpoint_dir and tokenizer.path (both under the gemma-4-e4b-it
# snapshot), or override them on the CLI. The output (unembedding) is tied to the token
# embedding, so it is NOT a LoRA target.
#
#   tune run lora_finetune_single_device --config recipes/configs/gemma4/e4b_lora_single_device.yaml \
#       checkpointer.checkpoint_dir=/path/to/gemma-4-e4b-it/ tokenizer.path=/path/to/gemma-4-e4b-it/tokenizer.json

output_dir: /tmp/torchtune/gemma4_e4b/lora_single_device

tokenizer:
  _component_: torchtune.models.gemma4.gemma4_tokenizer
  path: /PATH/TO/gemma-4-e4b-it/tokenizer.json
  max_seq_len: 512

dataset:
  _component_: torchtune.datasets.alpaca_cleaned_dataset
  packed: False
  split: train[:1%]
seed: 42
shuffle: True

model:
  _component_: torchtune.models.gemma4.lora_gemma4_e4b
  lora_attn_modules: ['q_proj', 'v_proj']
  apply_lora_to_mlp: False
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.0

checkpointer:
  _component_: torchtune.training.FullModelHFCheckpointer
  checkpoint_dir: /PATH/TO/gemma-4-e4b-it/
  checkpoint_files: [model.safetensors]
  recipe_checkpoint: null
  output_dir: ${output_dir}
  model_type: GEMMA4
resume_from_checkpoint: False
save_adapter_weights_only: True

optimizer:
  _component_: torch.optim.AdamW
  fused: False  # fused=True is CUDA-only
  lr: 2e-4
lr_scheduler:
  _component_: torchtune.training.lr_schedulers.get_cosine_schedule_with_warmup
  num_warmup_steps: 1

# Plain cross-entropy on logits (our decoder returns logits, not hidden states, so we do
# not use the fused/SFTLoss LinearCrossEntropyLoss here).
loss:
  _component_: torch.nn.CrossEntropyLoss

batch_size: 1
epochs: 1
max_steps_per_epoch: 2  # smoke-train
gradient_accumulation_steps: 1
compile: False

device: cpu
dtype: fp32
enable_activation_checkpointing: False
enable_activation_offloading: False

metric_logger:
  _component_: torchtune.training.metric_logging.DiskLogger
  log_dir: ${output_dir}/logs
log_every_n_steps: 1
log_peak_memory_stats: False
log_level: INFO

# Profiler (disabled; only needed for debugging).
profiler:
  _component_: torchtune.training.setup_torch_profiler
  enabled: False
  output_dir: ${output_dir}/profiling_outputs
  cpu: True
  cuda: False
  profile_memory: False
  with_stack: False
  record_shapes: True
  with_flops: False
  wait_steps: 5
  warmup_steps: 5
  active_steps: 2
  num_cycles: 1
